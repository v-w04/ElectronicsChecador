<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero de juegos · Electronics México</title>
<link rel="icon" href="favicon.ico">
<script src="avatar.js"></script>
<script src="actualizar.js"></script>
<script src="ui.js"></script>
<script src="site-pin.js"></script>
<style>
/* ===========================================================================
   TABLERO DE JUEGOS — Electronics México
   Aire de consola: fondo claro, tarjetas cuadradas, un solo acento rojo y
   tipografía gorda. Nada de marcas ni personajes ajenos: los juegos se
   distinguen por su inicial y su color, no por arte de nadie más.
   =========================================================================== */
:root{
  /* Los colores del menu del Switch y de la eShop: fondo gris claro,
     tarjetas blancas, tinta casi negra y los dos neones de los Joy-Con.
     Solo el color: nada de logos ni personajes. */
  --papel:#ffffff;
  --fondo:#ebebeb;
  --panel:#ffffff;
  --linea:#dcdcdc;
  --tinta:#2d2d2d;
  --tinta-2:#5a5f66;
  --tinta-3:#8b9198;
  --rojo:#e60012;        /* el rojo de la marca */
  --rojo-hi:#ff3c28;     /* neon rojo del Joy-Con */
  --azul:#00c3e3;        /* neon azul del Joy-Con */
  --azul-hondo:#0a7cff;
  --naranja:#ff7d00;     /* el naranja de la eShop */
  --verde:#0f9d58;
  --oro:#e8a800;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --r-chico:10px; --r:16px; --r-grande:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--sans)}
/* El hueco de arriba NO va en el body: lo pone la barra fija, que es opaca.
   Si el hueco fuera del body, al hacer scroll el contenido se metería
   igual debajo del reloj y la pila del teléfono. */
body{padding-inline:max(16px, env(safe-area-inset-left));
  padding-bottom:calc(48px + env(safe-area-inset-bottom))}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{margin:0;letter-spacing:-.02em}
button{font-family:inherit}

/* --- barra superior --- */
.barra{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-block:18px 0;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:11px}
.marca .bolita{width:34px;height:34px;border-radius:50%;background:var(--rojo)}
.marca b{font-size:16px;font-weight:800}
.marca span{display:block;font-size:11.5px;color:var(--tinta-3);font-weight:600;
  letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:6px}
.tabs a{text-decoration:none;color:var(--tinta-2);font-weight:700;font-size:14px;
  padding:9px 16px;border-radius:999px}
.tabs a:hover{background:#e9ebee;color:var(--tinta)}
.tabs a.on{background:var(--tinta);color:#fff}
.tabs a.fuera{margin-left:auto;color:var(--tinta-3)}
.tabs a.fuera::after{content:' \2197'}

/* --- título --- */
.encabezado{padding-block:26px 6px;display:flex;align-items:flex-end;
  justify-content:space-between;gap:16px;flex-wrap:wrap}
.encabezado h1{font-size:34px;font-weight:800}
.encabezado p{margin:6px 0 0;color:var(--tinta-2);font-size:14px}
.acciones-cab{display:flex;gap:10px;flex-wrap:wrap}

/* --- avisos --- */
/* AVISOS — toast flotante, NUNCA en el flujo
   -------------------------------------------------------------------------
   Antes esto era un bloque normal entre los botones: al aparecer empujaba
   todo lo de abajo y al irse lo regresaba de golpe. Un aviso que dura 4
   segundos no tiene por qué mover la pantalla.
   Ahora vive fuera de .wrap (pegado al body), en position:fixed, así que
   entra y sale encima de todo sin recalcular nada. No se puede tocar
   (pointer-events:none) para que no tape un botón. Se levanta lo suficiente
   para no chocar con el control de zoom de la esquina. */
#aviso{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);
  transform:translateX(-50%) translateY(-12px);
  width:max-content;max-width:min(420px,calc(100vw - 32px));
  z-index:70;border-radius:14px;padding:12px 16px;font-size:13.5px;
  line-height:1.45;white-space:pre-line;text-align:center;pointer-events:none;
  border:1px solid #d7dce3;background:#ffffff;color:#1f2933;
  box-shadow:0 12px 34px rgba(0,0,0,.18);
  opacity:0;visibility:hidden;
  transition:opacity .18s ease,transform .18s ease,visibility .18s}
#aviso.ver{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#aviso{transition:none}}
#aviso.ok{background:#e9f7ee;border-color:#bfe6cd;color:#0b6b3a}
#aviso.err{background:#fdecef;border-color:#f7c3cd;color:#9b0020}

/* --- fila de juegos --- */
.juegos{display:flex;gap:14px;overflow-x:auto;padding:22px 2px 6px;scroll-snap-type:x mandatory}
.juego{scroll-snap-align:start;flex:0 0 auto;width:150px;border:0;background:transparent;
  padding:0;cursor:pointer;text-align:center}
.juego .caja svg{width:58%;height:58%}
.juego .caja .portada{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.ico svg{width:60%;height:60%}
.ico .portada{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.juego .caja{width:150px;height:150px;border-radius:var(--r-grande);display:flex;overflow:hidden;
  align-items:center;justify-content:center;font-size:56px;color:#fff;
  box-shadow:0 2px 0 rgba(0,0,0,.06);transition:transform .12s ease}
.juego:hover .caja{transform:translateY(-3px);box-shadow:0 0 0 4px var(--azul)}
.juego:focus-visible .caja{outline:0;box-shadow:0 0 0 4px var(--azul)}
.juego.sel .caja{outline:4px solid var(--rojo);outline-offset:3px}
.juego .nombre{margin-top:10px;font-weight:800;font-size:14px;line-height:1.25}
.juego .dato{font-size:12px;color:var(--tinta-3);font-weight:600}
.juego.nuevo .caja{background:var(--panel);color:var(--tinta-3);border:2px dashed var(--linea);font-size:34px}

/* --- paneles --- */
.panel{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r-grande);
  padding:20px;margin-top:18px}
.panel h2{font-size:19px;font-weight:800}
.panel .sub{color:var(--tinta-3);font-size:13px;margin-top:3px}
.cab{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* --- botones --- */
.btn{border:0;border-radius:999px;padding:13px 22px;font-size:15px;font-weight:800;cursor:pointer}
.btn.rojo{background:var(--rojo);color:#fff}
.btn.rojo:hover{background:var(--rojo-hi)}
.btn.claro{background:#eceef1;color:var(--tinta)}
.btn.claro:hover{background:#e0e3e7}
.btn.chico{padding:9px 15px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}

/* --- filtros --- */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.filtro{border:1px solid var(--linea);background:var(--papel);color:var(--tinta-2);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;cursor:pointer}
.filtro.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}

/* --- tabla de posiciones --- */
.tabla{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

/* Marcador de cada quien: lo importante en grande. */
.tarjeta{border:2px solid var(--linea);border-radius:20px;background:var(--panel);padding:16px}
.tarjeta.lider{border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,195,227,.18)}
.tarjeta .cabe{display:flex;align-items:center;gap:11px}
.tarjeta .avat{width:46px;height:46px;flex:0 0 auto;border-radius:50%;overflow:hidden;
  background:var(--fondo);display:flex;align-items:center;justify-content:center;
  font-weight:700;color:var(--tinta-3)}
.tarjeta .avat img{width:100%;height:100%;display:block}
.tarjeta .quien{flex:1;min-width:0}
.tarjeta .quien .nm{font-size:16px;font-weight:800;color:var(--tinta);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tarjeta .quien .pos{font-size:12px;color:var(--tinta-3);font-weight:600;margin-top:2px}
.tarjeta .racha{flex:0 0 auto;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:800}
.tarjeta .racha.buena{background:rgba(255,125,0,.14);color:#c25e00}
.tarjeta .racha.mala{background:rgba(0,195,227,.16);color:#0a7c93}
.tarjeta .cifras{display:flex;gap:6px;margin-top:14px}
.tarjeta .cif{flex:1;text-align:center;background:var(--fondo);border-radius:13px;padding:9px 4px}
.tarjeta .cif b{display:block;font-size:26px;line-height:1.05;color:var(--tinta);font-weight:800}
.tarjeta .cif span{display:block;font-size:10.5px;color:var(--tinta-3);font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.tarjeta .cif.gano b{color:var(--rojo)}
/* (Aqui vivia .fila, la maqueta vieja de la tabla de posiciones. Hoy la
   tabla se pinta con .tarjeta y ningun .fila se genera nunca.) */

/* --- histórico --- */
.partida{border:1px solid var(--linea);border-radius:var(--r);padding:14px 16px;margin-top:10px;
  display:flex;gap:14px;align-items:flex-start}
.partida .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:21px;color:#fff;flex:0 0 auto}
.partida .cuerpo{flex:1;min-width:0}
.partida .tirar{width:32px;height:32px;flex:0 0 auto;border:0;border-radius:50%;cursor:pointer;
  background:transparent;color:var(--tinta-3);font-size:20px;line-height:1;font-family:inherit;
  display:flex;align-items:center;justify-content:center}
.partida .tirar:hover{background:rgba(230,0,18,.1);color:var(--rojo)}
.partida .linea1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.partida .juego-n{font-weight:800}
.partida .cuando{font-size:12.5px;color:var(--tinta-3);font-family:var(--mono)}
.partida .nota{font-size:12.5px;color:var(--tinta-3)}
.partida ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.partida ol li::marker{color:var(--tinta-3);font-weight:700}
.partida .gan{font-weight:800}

/* --- modal --- */
.fondo{position:fixed;inset:0;background:rgba(20,20,22,.55);display:none;
  align-items:center;justify-content:center;padding:16px;z-index:40;
  overflow:hidden}
.fondo.ver{display:flex}
.modal{background:var(--papel);border-radius:26px;width:100%;max-width:560px;
  max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  position:relative;padding:0 24px calc(16px + env(safe-area-inset-bottom))}
/* La cabecera se queda pegada arriba: la X nunca se va con el scroll. */
.modal .cab-modal{position:sticky;top:0;z-index:2;background:var(--papel);
  padding:22px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--linea)}
.modal h3{font-size:22px;font-weight:800;margin:0}
.equis{width:40px;height:40px;flex:0 0 auto;border:0;border-radius:50%;cursor:pointer;
  background:var(--fondo);color:var(--tinta-2);font-size:22px;line-height:1;
  display:flex;align-items:center;justify-content:center;font-family:inherit}
.equis:hover{background:#dfe1e4;color:var(--tinta)}
.campo{margin-top:16px}
.campo label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--tinta-3);margin-bottom:6px}
.campo input,.campo select{width:100%;padding:12px 14px;border:1px solid var(--linea);
  border-radius:var(--r-chico);font-size:15px;font-family:inherit;background:var(--papel);color:var(--tinta)}
.campo input:focus,.campo select:focus{outline:2px solid var(--azul);outline-offset:1px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.chip{border:2px solid var(--linea);background:var(--papel);border-radius:18px;
  padding:12px 6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--tinta-2);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .12s ease,border-color .12s ease}
.chip .cara{width:58px;height:58px;border-radius:50%;overflow:hidden;background:var(--fondo);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--tinta-3)}
.chip .cara img{width:100%;height:100%;display:block}
.chip .nm{line-height:1.2;text-align:center;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chip:active{transform:scale(.95)}
/* Elegido: el aro de neón azul del menú del Switch. */
.chip.on{border-color:var(--azul);color:var(--tinta);box-shadow:0 0 0 3px rgba(0,195,227,.25)}
.chip.on .cara{box-shadow:0 0 0 2px var(--azul)}

/* Los del podio, también con su cara. */
.podio .p .avat{width:30px;height:30px;border-radius:50%;overflow:hidden;flex:0 0 auto}
.podio .p .avat img{width:100%;height:100%;display:block}
/* Cada carrera: se van tocando las caras en el orden en que llegaron. */
.ronda{border:1px solid var(--linea);border-radius:16px;padding:12px;margin-top:10px}
.ronda .cab-r{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin-bottom:10px}
.ronda .cab-r b{font-size:14px;color:var(--tinta)}
.ronda .cab-r .pista{font-size:12px;color:var(--tinta-3)}
.ronda .cab-r button{border:0;background:transparent;color:var(--azul-hondo);cursor:pointer;
  font-family:inherit;font-weight:700;font-size:12px}
.ronda .pista-caras{display:flex;flex-wrap:wrap;gap:8px}
.corredor{position:relative;border:2px solid var(--linea);background:var(--papel);
  border-radius:14px;padding:8px 6px 6px;cursor:pointer;width:72px;
  display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit}
.corredor .c{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--fondo);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  color:var(--tinta-3)}
.corredor .c img{width:100%;height:100%;display:block}
.corredor .n{font-size:11px;font-weight:700;color:var(--tinta-2);line-height:1.15;text-align:center;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.corredor.puesto{border-color:var(--azul);color:var(--tinta)}
.corredor .lug{position:absolute;top:-8px;right:-6px;min-width:22px;height:22px;border-radius:999px;
  background:var(--tinta);color:#fff;font-size:11px;font-weight:800;display:flex;
  align-items:center;justify-content:center;padding:0 5px}
.corredor.p1 .lug{background:var(--oro);color:#2d2d2d}
.corredor.p2 .lug{background:#9aa3ab}
.corredor.p3 .lug{background:#c1703a}

.podio{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.podio .p{display:grid;grid-template-columns:34px minmax(0,1fr) 96px;gap:10px;align-items:center}
.podio .p .lugar{font-weight:800;text-align:center;color:var(--tinta-3)}
.podio .p .nom{font-weight:700;font-size:14px;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podio .p input{padding:9px 10px;font-size:14px;border:1px solid var(--linea);border-radius:8px;width:100%}
.nota-retomado{margin:14px 0 0;padding:10px 12px;border-radius:12px;font-size:12.5px;
  background:rgba(0,195,227,.12);color:#0a7c93;font-weight:600}
.acciones{display:flex;gap:10px;margin-top:22px;position:sticky;bottom:0;z-index:2;
  background:var(--papel);padding:14px 0 6px;border-top:1px solid var(--linea)}
.acciones .btn{flex:1}

/* ── CELULAR ────────────────────────────────────────────────────────────
   La barra de arriba en renglones y las pestañas deslizables: apretadas se
   encimaban con la hora y la señal del teléfono. */
@media (max-width:700px){
  /* Barra fija arriba: se queda pegada al desplazar y tapa por completo la
     franja del reloj, la señal y la pila. El contenido pasa por DETRÁS de
     ella, nunca por debajo de la barra de estado del sistema. */
  .barra{position:sticky;top:0;z-index:40;flex-direction:column;align-items:stretch;gap:10px;
    background:var(--fondo);
    margin-left:calc(-1 * max(16px, env(safe-area-inset-left)));
    margin-right:calc(-1 * max(16px, env(safe-area-inset-right)));
    padding-left:max(16px, env(safe-area-inset-left));
    padding-right:max(16px, env(safe-area-inset-right));
    padding-top:calc(env(safe-area-inset-top) + 10px);
    padding-bottom:10px;
    border-bottom:1px solid var(--linea)}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{flex:0 0 auto;font-size:13.5px;padding:8px 14px}
  .encabezado{flex-direction:column;align-items:stretch;gap:12px}
  .acciones-cab{width:100%}
  .acciones-cab .btn{flex:1}
  .fondo{align-items:flex-end;padding:0}
  .modal{border-radius:24px 24px 0 0;
    max-height:88vh;max-height:88dvh;
    padding-left:16px;padding-right:16px;
    padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  /* Con varias carreras la ventana se alarga: las caras se hacen chicas
     para que quepan más por renglón y no haya que bajar tanto. */
  .corredor{width:62px;padding:6px 4px 5px}
  .corredor .c{width:36px;height:36px}
  .corredor .n{font-size:11.5px}
  .ronda{padding:10px}
}
/* Pantallas angostas: que nada se monte. */
@media (max-width:620px){
  .encabezado h1{font-size:27px}
  .juego,.juego .caja{width:126px}
  .juego .caja{height:126px;font-size:46px}
  .leyenda{text-align:center;font-size:11.5px}
}
@media (max-width:430px){
  .marca b{font-size:14.5px}
  .marca span{font-size:11px}
  .tabs a{font-size:12.5px;padding:8px 12px}
  .acciones-cab .btn{font-size:13.5px;padding:12px 14px}
  .chips{grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
  .chip .cara{width:50px;height:50px}
  .chip{padding:9px 4px 8px;font-size:11.5px}
}
/* ── TABLET Y COMPUTADORA ───────────────────────────────────────────────
   En la tablet todo se veía diminuto: esta pantalla nació pensada para
   monitor y nunca creció. Aquí sube de tamaño de forma pareja, igual que
   Mi checador: las fichas, los marcadores, la ventana de registrar y las
   caras de los corredores. */
/* TABLET — arranca en 701px, pegado al bloque de celular, para que no
   quede el hueco de 701-759 donde caian la iPad Mini y las Android de 8".
   La columna se ACOTA (antes iba a sangre) y los tamanos crecen con el
   ancho: una tablet de 820 y una de 1024 ya no reciben lo mismo. */
@media (min-width:701px){
  body{font-size:clamp(16px,1.7vw,17.5px);
    padding-inline:max(28px, env(safe-area-inset-left))}
  .wrap{max-width:880px}

  .barra{padding-block:18px 14px}
  .marca .bolita{width:42px;height:42px}
  .marca b{font-size:17px}
  .tabs a{font-size:clamp(15px,1.7vw,16.5px);padding:11px 19px}

  .encabezado{padding-block:30px 8px}
  .encabezado h1{font-size:clamp(32px,4.4vw,44px)}
  .encabezado p{font-size:clamp(15px,1.7vw,17px)}
  .btn{font-size:clamp(15px,1.7vw,17px);padding:14px 22px}

  /* Las fichas de los juegos, grandes: son lo primero que se toca. */
  .juego,.juego .caja{width:clamp(168px,20vw,200px)}
  .juego .caja{height:clamp(168px,20vw,200px);font-size:clamp(56px,6.6vw,66px)}
  .juego .nombre{font-size:clamp(16px,1.8vw,18px)}
  .juego .dato{font-size:clamp(13px,1.5vw,14.5px)}

  .panel{padding:24px}
  .panel h2{font-size:22px}
  .panel .sub{font-size:14px}
  .filtro{font-size:14.5px;padding:10px 18px}

  /* Marcadores */
  .tabla{grid-template-columns:repeat(auto-fill,minmax(clamp(258px,30vw,300px),1fr));gap:16px}
  .tarjeta{padding:20px;border-radius:22px}
  .tarjeta .avat{width:56px;height:56px}
  .tarjeta .quien .nm{font-size:clamp(17px,2vw,20px)}
  .tarjeta .quien .pos{font-size:13.5px}
  .tarjeta .racha{font-size:14px;padding:6px 12px}
  .tarjeta .cif{padding:12px 6px;border-radius:15px}
  .tarjeta .cif b{font-size:clamp(30px,3.6vw,36px)}
  .tarjeta .cif span{font-size:12px}

<!-- Fuera de .wrap (el zoom de ui.js escala .wrap) pero ANTES del script:
     el script guarda la referencia al arrancar, y si el div viniera despues
     se la encontraba vacia y reventaba en la primera llamada a aviso(). -->
<div id="aviso" role="status" aria-live="polite"></div>

<script>
/* ===========================================================================
   CONFIGURACIÓN
   =========================================================================== */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxWu65gJ3jIbRp9WIbvNjia9IFsDJORUggDNyYUUQA_JxLYsbYjsawynN9hbV1kPqU5/exec';

// Colores de las cajas. Se reparten por orden del catálogo, así que un juego
// siempre tiene el mismo color mientras no se reordene la hoja JUEGOS.
var COLORES = ['#e4002b','#0a7cff','#0f9d58','#7b3fe4','#e8a800','#00b3a4','#ff6b00','#d6006e'];

/* ===========================================================================
   PUENTE CON APPS SCRIPT
   text/plain a propósito: con application/json el navegador manda una
   petición previa que Apps Script no contesta.
   =========================================================================== */
function gas(fn, args) {
  return fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [] }),
    redirect: 'follow'
  })
  .then(function (r) { return r.text(); })
  .then(function (t) {
    try { return JSON.parse(t); }
    catch (e) { throw new Error('Respuesta rara del servidor: ' + t.slice(0, 120)); }
  });
}

/* ===========================================================================
   ESTADO
   =========================================================================== */
var JUEGOS = [];
var JUGADORES = [];
var AVATARES = (function(){ try { return JSON.parse(localStorage.getItem('em_checar_avatares')) || {}; } catch(e){ return {}; } })();
/**
 * La pestaña que lleva al checador del site.
 *
 * Ya NO trae la dirección: el servidor solo dice si existe. La dirección se
 * entrega contra el PIN, en site-pin.js. Antes viajaba a cualquiera que
 * abriera la app y se guardaba en el aparato, así que el candado no habría
 * servido de nada en los celulares que ya la tenían.
 */
function ponerLigaSite(hay) {
  try { SitePin.mostrar(!!hay); } catch (e) {}
}
try { SitePin.iniciar(gas, 'tab-intranet'); } catch (e) {}

function cortito(n) { var p = (n || '').trim().split(/\s+/); return p.slice(0, 2).join(' '); }
/** El área de una persona, para que su avatar tenga el mismo color que en
 *  el resto de la app. */
function avArea(nombre) {
  for (var i = 0; i < JUGADORES.length; i++) {
    if (JUGADORES[i].nombre === nombre) return JUGADORES[i].area || '';
  }
  return '';
}
var PARTIDAS = [];      // una fila por jugador
var juegoSel = null;
var periodo = 'hoy';    // 'hoy' | 'mes' | 'todo'
var tableroDesde = '';  // corte manual del tablero (lo pone "Limpiar tablero")
var filtroJugador = '';
var seleccion = [];     // ids elegidos en el modal, en orden

/* ===========================================================================
   BORRADOR
   ===========================================================================
   Nada de quedarse congelado en la ventana. Todo lo que se va capturando se
   guarda al instante: puedes cerrarla, irte a ver el marcador, salirte de la
   app y al volver sigue ahí, tal cual la dejaste.

   Y los jugadores quedan como "los de siempre": la próxima vez ya vienen
   marcados y solo se ajusta quién faltó. */
var LS_BORRADOR = 'em_juegos_borrador';
var LS_ACTIVOS  = 'em_juegos_activos';

function guardarBorrador() {
  try {
    localStorage.setItem(LS_BORRADOR, JSON.stringify({
      juego: (document.getElementById('m-juego') || {}).value || '',
      fecha: (document.getElementById('m-fecha') || {}).value || '',
      nota:  (document.getElementById('m-nota')  || {}).value || '',
      seleccion: seleccion,
      nRondas: nRondas,
      ordenes: ordenes
    }));
    localStorage.setItem(LS_ACTIVOS, JSON.stringify(seleccion));
  } catch (e) {}
}

function leerBorrador() {
  try { return JSON.parse(localStorage.getItem(LS_BORRADOR)) || null; }
  catch (e) { return null; }
}

function tirarBorrador() {
  try { localStorage.removeItem(LS_BORRADOR); } catch (e) {}
  seleccion = [];
  nRondas = 1;
  ordenes = [];
}

function jugadoresDeSiempre() {
  try { return JSON.parse(localStorage.getItem(LS_ACTIVOS)) || []; }
  catch (e) { return []; }
}

var elAviso = document.getElementById('aviso');
function aviso(t, clase) { elAviso.className = 'ver ' + (clase || ''); elAviso.textContent = t; }
function quitarAviso(ms) { setTimeout(function () { elAviso.className = ''; }, ms || 4000); }


/* ===========================================================================
   ARTE DE LAS FICHAS
   ===========================================================================
   Dibujos propios, hechos aquí con SVG: una bandera a cuadros para lo de
   carreras, un estallido para lo de pelea, y así. Se escalan sin pixelearse
   y no pesan nada, que es justo lo que necesita una ficha grande.

   Si un juego no cae en ninguna categoría, se queda con el emoji que trae
   la hoja JUEGOS. */
var ARTE = {
  carreras:
    '<svg viewBox="0 0 64 64" aria-hidden="true">' +
      '<g fill="#fff" opacity=".5">' +
        '<rect x="1" y="16" width="9" height="4" rx="2"/>' +
        '<rect x="0" y="28" width="7" height="4" rx="2"/>' +
        '<rect x="2" y="40" width="9" height="4" rx="2"/>' +
      '</g>' +
      '<rect x="14" y="6" width="5" height="52" rx="2.5" fill="#fff"/>' +
      '<g fill="#fff">' +
        '<rect x="21" y="10" width="10" height="10"/><rect x="41" y="10" width="10" height="10"/>' +
        '<rect x="31" y="20" width="10" height="10"/><rect x="51" y="20" width="10" height="10"/>' +
        '<rect x="21" y="30" width="10" height="10"/><rect x="41" y="30" width="10" height="10"/>' +
      '</g>' +
      '<rect x="21" y="10" width="40" height="30" fill="none" stroke="#fff" stroke-width="2.5" opacity=".55"/>' +
    '</svg>',

  pelea:
    '<svg viewBox="0 0 64 64" aria-hidden="true">' +
      '<polygon fill="#fff" points="32,2 38.5,19 53,10 48.5,26 63,32 48.5,38 53,54 38.5,45 32,62 ' +
        '25.5,45 11,54 15.5,38 1,32 15.5,26 11,10 25.5,19"/>' +
      '<circle cx="32" cy="32" r="10" fill="#000" opacity=".2"/>' +
    '</svg>',

  balon:
    '<svg viewBox="0 0 64 64" aria-hidden="true">' +
      '<circle cx="32" cy="32" r="26" fill="#fff"/>' +
      '<polygon fill="#000" opacity=".75" points="32,17 43,25 39,38 25,38 21,25"/>' +
      '<g fill="#000" opacity=".45">' +
        '<polygon points="32,6 40,12 32,17 24,12"/>' +
        '<polygon points="9,29 19,24 21,25 19,37"/>' +
        '<polygon points="55,29 45,24 43,25 45,37"/>' +
      '</g>' +
    '</svg>',

  cartas:
    '<svg viewBox="0 0 64 64" aria-hidden="true">' +
      '<rect x="9" y="16" width="26" height="36" rx="5" fill="#fff" opacity=".55" ' +
        'transform="rotate(-12 22 34)"/>' +
      '<rect x="27" y="12" width="26" height="36" rx="5" fill="#fff" ' +
        'transform="rotate(10 40 30)"/>' +
      '<polygon fill="#000" opacity=".7" points="40,22 46,29 40,37 34,29" ' +
        'transform="rotate(10 40 30)"/>' +
    '</svg>',

  ajedrez:
    '<svg viewBox="0 0 64 64" aria-hidden="true">' +
      '<circle cx="32" cy="15" r="8" fill="#fff"/>' +
      '<path fill="#fff" d="M24 26h16l-4 12h-8z"/>' +
      '<path fill="#fff" d="M20 40h24l4 12H16z"/>' +
    '</svg>',

  dardos:
    '<svg viewBox="0 0 64 64" aria-hidden="true">' +
      '<circle cx="32" cy="32" r="26" fill="#fff"/>' +
      '<circle cx="32" cy="32" r="18" fill="#000" opacity=".22"/>' +
      '<circle cx="32" cy="32" r="10" fill="#fff"/>' +
      '<circle cx="32" cy="32" r="4" fill="#000" opacity=".6"/>' +
    '</svg>'
};

function _sinAcentos(t) {
  return (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

/**
 * La columna "Icono" de la hoja JUEGOS acepta tres cosas:
 *   · un emoji            →  🏁
 *   · un archivo del repo →  juegos/mi-imagen.png   (súbelo a docs/juegos/)
 *   · una dirección web   →  https://.../imagen.png
 * Si trae imagen, esa manda sobre todo lo demás.
 */
function esImagen(v) {
  return /^(https?:\/\/|\.?\/?[\w.\-\/]+\.(png|jpe?g|webp|gif|svg))$/i.test((v || '').trim());
}

function imagenDe(v) {
  return '<img class="portada" src="' + (v || '').trim() + '" alt="" loading="lazy">';
}

/** Elige el dibujo por lo que dice el nombre del juego. */
function arteDe(nombre) {
  var n = _sinAcentos(nombre).toLowerCase();
  if (/kart|carrera|race|racing|auto|coche|rally|velocidad/.test(n)) return ARTE.carreras;
  if (/smash|pelea|lucha|fight|box|combate|guerra|versus/.test(n))   return ARTE.pelea;
  if (/futbol|soccer|fifa|balon|basquet|volei/.test(n))              return ARTE.balon;
  if (/carta|poker|uno|baraja|domino|loteria/.test(n))               return ARTE.cartas;
  if (/ajedrez|chess|damas/.test(n))                                 return ARTE.ajedrez;
  if (/dardo|tiro|puntería|punteria|billar/.test(n))                 return ARTE.dardos;
  return '';
}

function colorDe(nombre) {
  var i = JUEGOS.map(function (j) { return j.juego; }).indexOf(nombre);
  return COLORES[(i < 0 ? 0 : i) % COLORES.length];
}
function iconoDe(nombre) {
  var j = JUEGOS.filter(function (x) { return x.juego === nombre; })[0];
  return j ? j.icono : '🎮';
}
function mesDe(fecha) { return (fecha || '').slice(0, 7); }
function hoyJuegos() {
  var d = new Date(), z = function(n){ return (n<10?'0':'') + n; };
  return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate());
}
/** Hora del corte si el corte es de hoy; si es de otro dia, ya no aplica. */
function corteDeHoy() {
  if (!tableroDesde) return '';
  var p = String(tableroDesde).split(' ');
  return (p[0] === hoyJuegos()) ? (p[1] || '') : '';
}
function mesActual() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function fechaBonita(f) {
  var p = (f || '').split('-');
  if (p.length !== 3) return f || '';
  var MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return parseInt(p[2], 10) + ' ' + MES[parseInt(p[1], 10) - 1];
}

/* ===========================================================================
   FILA DE JUEGOS
   =========================================================================== */
function pintarJuegos() {
  var cont = document.getElementById('juegos');
  cont.innerHTML = '';

  JUEGOS.filter(function (j) { return j.activo; }).forEach(function (j) {
    var partidas = {};
    PARTIDAS.forEach(function (p) { if (p.juego === j.juego) partidas[p.id] = true; });
    var n = Object.keys(partidas).length;

    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'juego' + (juegoSel === j.juego ? ' sel' : '');
    b.innerHTML =
      '<div class="caja" style="background:' + colorDe(j.juego) + '">' +
        (esImagen(j.icono) ? imagenDe(j.icono) : (arteDe(j.juego) || j.icono)) + '</div>' +
      '<div class="nombre">' + j.juego + '</div>' +
      '<div class="dato">' + (n ? n + (n === 1 ? ' partida' : ' partidas') : 'sin partidas') + '</div>';
    b.onclick = function () { juegoSel = j.juego; pintarTodo(); };
    cont.appendChild(b);
  });

  var nuevo = document.createElement('button');
  nuevo.type = 'button';
  nuevo.className = 'juego nuevo';
  nuevo.innerHTML = '<div class="caja">＋</div><div class="nombre">Agregar juego</div>' +
                    '<div class="dato">nuevo marcador</div>';
  nuevo.onclick = nuevoJuego;
  cont.appendChild(nuevo);
}

function nuevoJuego() {
  var nombre = prompt('¿Qué juego agregamos?');
  if (!nombre) return;
  var icono = prompt('Un emoji para su caja (Enter para 🎮)') || '🎮';
  aviso('Agregando ' + nombre + '...');
  gas('agregarJuego', [nombre, icono, 'POSICION'])
    .then(function (r) {
      if (!r || !r.ok) throw new Error((r && r.message) || 'no se pudo');
      aviso('✓ ' + r.message, 'ok'); quitarAviso();
      cargar();
    })
    .catch(function (e) { aviso('No se pudo agregar: ' + e.message, 'err'); });
}

/* ===========================================================================
   POSICIONES
   =========================================================================== */
function partidasAgrupadas(filtro) {
  var mapa = {};
  PARTIDAS.forEach(function (p) {
    if (filtro && !filtro(p)) return;
    if (!mapa[p.id]) mapa[p.id] = { id: p.id, fecha: p.fecha, hora: p.hora,
                                    juego: p.juego, nota: p.nota, jugadores: [] };
    mapa[p.id].jugadores.push(p);
  });
  return Object.keys(mapa).map(function (k) { return mapa[k]; })
    .map(function (par) {
      par.jugadores.sort(function (a, b) {
        if (a.posicion != null && b.posicion != null) return a.posicion - b.posicion;
        return (b.puntos || 0) - (a.puntos || 0);
      });
      return par;
    })
    .sort(function (a, b) {
      return (b.fecha + b.hora).localeCompare(a.fecha + a.hora);
    });
}

function pintarTabla() {
  document.getElementById('titulo-tabla').textContent =
    juegoSel ? 'Posiciones · ' + juegoSel : 'Posiciones';
  document.getElementById('sub-tabla').textContent =
    (periodo === 'hoy' ? 'Hoy' : periodo === 'mes' ? 'Este mes' : 'Desde el principio') +
    (juegoSel ? '' : ' · todos los juegos');

  var bn = document.getElementById('btn-nueva');
  if (bn) {
    var b0 = leerBorrador();
    var aMedias = b0 && (b0.seleccion || []).length;
    bn.textContent = aMedias ? 'Continuar partida' : 'Registrar partida';
  }

  var bl = document.getElementById('btn-limpiar');
  if (bl) bl.textContent = corteDeHoy() ? 'Reabrir tablero' : 'Limpiar tablero';

  var pers = document.getElementById('filtros-periodo');
  pers.innerHTML = '';
  [['hoy', 'Hoy'], ['mes', 'Este mes'], ['todo', 'Todo']].forEach(function (op) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'filtro' + (periodo === op[0] ? ' on' : '');
    b.textContent = op[1];
    b.onclick = function () { periodo = op[0]; pintarTodo(); };
    pers.appendChild(b);
  });
  if (juegoSel) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'filtro';
    b.textContent = '✕ ver todos los juegos';
    b.onclick = function () { juegoSel = null; pintarTodo(); };
    pers.appendChild(b);
  }

  var mes = mesActual();
  var stats = {};
  partidasAgrupadas(function (p) {
    if (juegoSel && p.juego !== juegoSel) return false;
    if (periodo === 'mes' && mesDe(p.fecha) !== mes) return false;
    if (periodo === 'hoy') {
      if (p.fecha !== hoyJuegos()) return false;
      // Si hoy se limpio el tablero, solo cuenta lo de despues del corte.
      if (corteDeHoy() && (p.hora || '') < corteDeHoy()) return false;
    }
    return true;
  }).forEach(function (par) {
    par.jugadores.forEach(function (j, idx) {
      var k = j.jugador || j.idJugador;
      if (!stats[k]) stats[k] = { nombre: k, jugadas: 0, ganadas: 0, podios: 0, puntos: 0 };
      stats[k].jugadas++;
      if (idx === 0) stats[k].ganadas++;
      if (idx < 3) stats[k].podios++;
      stats[k].puntos += (j.puntos || 0);
    });
  });

  var lista = Object.keys(stats).map(function (k) { return stats[k]; })
    .sort(function (a, b) {
      if (b.ganadas !== a.ganadas) return b.ganadas - a.ganadas;
      if (b.podios !== a.podios) return b.podios - a.podios;
      return b.puntos - a.puntos;
    });

  var cont = document.getElementById('tabla');
  cont.innerHTML = '';
  if (!lista.length) {
    cont.innerHTML = '<div class="vacio">Todavía no hay partidas aquí. Registra una y aparecen los marcadores.</div>';
    return;
  }

  // Una tarjeta por persona, con el número que importa en grande. Nada de
  // tabla: de un vistazo se ve quién va ganando y quién trae racha.
  lista.forEach(function (s, i) {
    var perdidas = Math.max(0, s.jugadas - s.ganadas);
    var r = rachaDe(s.nombre);

    var c = document.createElement('div');
    c.className = 'tarjeta' + (i === 0 ? ' lider' : '');
    c.innerHTML =
      '<div class="cabe">' +
        '<span class="avat"><img alt="" loading="lazy" src="' +
          avatarUrl(s.nombre, avArea(s.nombre), AVATARES[s.nombre]) +
          '" onerror=\"if(this.parentNode)this.parentNode.textContent=\'' + avIniciales(s.nombre) + '\'"></span>' +
        '<div class="quien">' +
          '<div class="nm">' + cortito(s.nombre) + '</div>' +
          '<div class="pos">' + (i === 0 ? '👑 va ganando' : (i + 1) + '° lugar') + '</div>' +
        '</div>' +
        (r.n > 1 ? '<span class="racha ' + (r.tipo === 'gana' ? 'buena' : 'mala') + '">' +
                     (r.tipo === 'gana' ? '🔥 ' : '🥶 ') + r.n + '</span>' : '') +
      '</div>' +
      '<div class="cifras">' +
        '<div class="cif gano"><b>' + s.ganadas + '</b><span>ganó</span></div>' +
        '<div class="cif"><b>' + perdidas + '</b><span>perdió</span></div>' +
        '<div class="cif"><b>' + s.jugadas + '</b><span>jugó</span></div>' +
        (s.puntos ? '<div class="cif"><b>' + s.puntos + '</b><span>puntos</span></div>' : '') +
      '</div>';
    cont.appendChild(c);
  });
}

/**
 * Cuántas lleva seguidas: ganadas al hilo, o perdidas al hilo.
 * Se mira de la partida más reciente hacia atrás.
 */
function rachaDe(nombre) {
  var suyas = partidasAgrupadas(function (p) {
    if (juegoSel && p.juego !== juegoSel) return false;
    return true;
  }).filter(function (par) {
    return par.jugadores.some(function (j) { return j.jugador === nombre; });
  });

  // partidasAgrupadas devuelve de la más nueva a la más vieja.
  var tipo = null, n = 0;
  for (var i = 0; i < suyas.length; i++) {
    var gano = (suyas[i].jugadores[0] || {}).jugador === nombre;
    var esta = gano ? 'gana' : 'pierde';
    if (tipo === null) { tipo = esta; n = 1; }
    else if (tipo === esta) { n++; }
    else break;
  }
  return { tipo: tipo || 'gana', n: n };
}

/** Borra una partida entera (todas sus filas). No se puede deshacer, así
 *  que pregunta antes. */
function borrar(par) {
  var quienes = par.jugadores.map(function (j) { return cortito(j.jugador); }).join(', ');
  if (!confirm('¿Borrar esta partida?\n\n' + par.juego + ' · ' + fechaBonita(par.fecha) +
               ' ' + (par.hora || '') + '\n' + quienes + '\n\nNo se puede deshacer.')) return;

  aviso('Borrando...');
  gas('borrarPartida', [par.id]).then(function (r) {
    if (!r || !r.ok) throw new Error((r && r.message) || 'no se pudo');
    PARTIDAS = PARTIDAS.filter(function (p) { return p.id !== par.id; });
    pintarTodo();
    aviso('Partida borrada.', 'ok');
    quitarAviso(3000);
  }).catch(function (e) {
    aviso('No se pudo borrar: ' + e.message, 'err');
  });
}

/* ===========================================================================
   HISTÓRICO
   =========================================================================== */
function pintarHistorico() {
  var sel = document.getElementById('filtro-jugador');
  if (!sel.options.length) {
    var nombres = {};
    PARTIDAS.forEach(function (p) { if (p.jugador) nombres[p.jugador] = true; });
    sel.innerHTML = '<option value="">Todos los jugadores</option>' +
      Object.keys(nombres).sort().map(function (n) {
        return '<option value="' + n + '">' + n + '</option>';
      }).join('');
    sel.onchange = function () { filtroJugador = sel.value; pintarHistorico(); };
  }

  var lista = partidasAgrupadas(function (p) {
    if (juegoSel && p.juego !== juegoSel) return false;
    return true;
  });
  if (filtroJugador) {
    lista = lista.filter(function (par) {
      return par.jugadores.some(function (j) { return j.jugador === filtroJugador; });
    });
  }

  document.getElementById('sub-hist').textContent =
    lista.length ? lista.length + (lista.length === 1 ? ' partida' : ' partidas') : '—';

  var cont = document.getElementById('historico');
  cont.innerHTML = '';
  if (!lista.length) {
    cont.innerHTML = '<div class="vacio">Sin partidas con estos filtros.</div>';
    return;
  }

  lista.slice(0, 20).forEach(function (par) {
    var d = document.createElement('div');
    d.className = 'partida';
    d.innerHTML =
      '<div class="ico" style="background:' + colorDe(par.juego) + '">' +
        (esImagen(iconoDe(par.juego)) ? imagenDe(iconoDe(par.juego))
                                      : (arteDe(par.juego) || iconoDe(par.juego))) + '</div>' +
      '<div class="cuerpo">' +
        '<div class="linea1">' +
          '<span class="juego-n">' + par.juego + '</span>' +
          '<span class="cuando">' + fechaBonita(par.fecha) + ' · ' + (par.hora || '') + '</span>' +
          (par.nota ? '<span class="nota">' + par.nota + '</span>' : '') +
        '</div>' +
        '<ol>' + par.jugadores.map(function (j, i) {
          return '<li' + (i === 0 ? ' class="gan"' : '') + '>' + cortito(j.jugador) +
                 (j.puntos ? ' · ' + j.puntos + ' pts' : '') + '</li>';
        }).join('') + '</ol>' +
      '</div>' +
      '<button class="tirar" type="button" title="Borrar esta partida" ' +
              'aria-label="Borrar esta partida">&times;</button>';

    d.querySelector('.tirar').onclick = function () { borrar(par); };
    cont.appendChild(d);
  });
}

function pintarTodo() { pintarJuegos(); pintarTabla(); pintarHistorico(); }

/* ===========================================================================
   MODAL: REGISTRAR PARTIDA
   =========================================================================== */
var fondo = document.getElementById('fondo');

document.getElementById('btn-nueva').onclick = abrirModal;

/* El tablero es del día que va corriendo: al día siguiente empieza en cero
   solo. Este botón hace el corte a media jornada. No borra nada: las
   partidas se quedan en el histórico. */
document.getElementById('btn-limpiar').onclick = function () {
  var btn = this;
  if (corteDeHoy()) {
    btn.disabled = true;
    gas('reabrirTableroJuegos', []).then(function (r) {
      if (!r || !r.ok) throw new Error((r && r.message) || 'no se pudo');
      tableroDesde = '';
      pintarTodo();
      aviso('Tablero reabierto: cuenta todo el día otra vez.', 'ok');
      quitarAviso(3500);
    }).catch(function (e) {
      aviso('No se pudo reabrir: ' + e.message, 'err');
    }).then(function () { btn.disabled = false; });
    return;
  }

  btn.disabled = true;
  gas('limpiarTableroJuegos', []).then(function (r) {
    if (!r || !r.ok) throw new Error((r && r.message) || 'no se pudo');
    tableroDesde = r.tableroDesde || '';
    periodo = 'hoy';
    pintarTodo();
    aviso('Tablero limpio. Las partidas siguen en el histórico.', 'ok');
    quitarAviso(4000);
  }).catch(function (e) {
    aviso('No se pudo limpiar: ' + e.message, 'err');
  }).then(function () { btn.disabled = false; });
};
/* Cerrar NO pierde nada: el borrador se queda. Para tirarlo de verdad está
   Descartar. */
document.getElementById('m-descartar').onclick = function () {
  if (!confirm('¿Descartar esta partida a medias?')) return;
  tirarBorrador();
  cerrarModal();
  aviso('Partida descartada.', 'ok');
  quitarAviso(2500);
};
document.getElementById('m-equis').onclick = cerrarModal;
['m-juego','m-fecha','m-nota'].forEach(function (id) {
  var el = document.getElementById(id);
  if (el) { el.onchange = guardarBorrador; el.oninput = guardarBorrador; }
});

// Tocar el fondo oscuro cierra. Tocar dentro del recuadro, no.
fondo.onclick = function (e) { if (e.target === fondo) cerrarModal(); };

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && fondo.classList.contains('ver')) cerrarModal();
});
fondo.addEventListener('click', function (e) { if (e.target === fondo) cerrarModal(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarModal(); });

function abrirModal() {
  var b = leerBorrador();

  // Si hay algo a medias, se retoma. Si no, se arranca con los jugadores de
  // siempre ya marcados.
  seleccion = (b && b.seleccion) ? b.seleccion.slice() : jugadoresDeSiempre().slice();
  nRondas   = (b && b.nRondas) ? b.nRondas : 1;
  ordenes   = (b && b.ordenes) ? b.ordenes.map(function (o) { return o.slice(); }) : [];

  // Los que ya no están en la lista de la app se caen solos.
  var validos = JUGADORES.map(function (j) { return j.id; });
  seleccion = seleccion.filter(function (id) { return validos.indexOf(id) !== -1; });
  ordenes = ordenes.map(function (o) {
    return o.filter(function (id) { return seleccion.indexOf(id) !== -1; });
  });

  var selJ = document.getElementById('m-juego');
  selJ.innerHTML = JUEGOS.filter(function (j) { return j.activo; }).map(function (j) {
    return '<option value="' + j.juego + '"' + (j.juego === juegoSel ? ' selected' : '') + '>' +
           j.icono + '  ' + j.juego + '</option>';
  }).join('');

  var hoy = new Date();
  document.getElementById('m-fecha').value =
    hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0') + '-' +
    String(hoy.getDate()).padStart(2, '0');
  if (b && b.juego) selJ.value = b.juego;
  if (b && b.fecha) document.getElementById('m-fecha').value = b.fecha;
  document.getElementById('m-nota').value = (b && b.nota) || '';

  var aviso1 = document.getElementById('m-retomado');
  if (aviso1) aviso1.hidden = !(b && (b.seleccion || []).length);

  var chips = document.getElementById('m-chips');
  chips.innerHTML = '';
  // Solo los que están en SÍ en la hoja APP_EMPLEADOS, y con su avatar:
  // se busca la cara, no se lee una lista de cuarenta nombres.
  JUGADORES.forEach(function (j) {
    var c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip' + (seleccion.indexOf(j.id) !== -1 ? ' on' : '');
    c.innerHTML =
      '<span class="cara"><img alt="" loading="lazy" src="' +
        avatarUrl(j.nombre, j.area, AVATARES[j.nombre]) + '"' +
        ' onerror=\"if(this.parentNode)this.parentNode.textContent=\'' + avIniciales(j.nombre) + '\'"></span>' +
      '<span class="nm">' + cortito(j.nombre) + '</span>';
    c.onclick = function () {
      var i = seleccion.indexOf(j.id);
      if (i === -1) { seleccion.push(j.id); c.classList.add('on'); }
      else {
        seleccion.splice(i, 1);
        c.classList.remove('on');
        ordenes = ordenes.map(function (o) {
          return o.filter(function (x) { return x !== j.id; });
        });
      }
      pintarPodio();
      guardarBorrador();
    };
    chips.appendChild(c);
  });

  pintarPodio();
  fondo.classList.add('ver');
}

function cerrarModal() { guardarBorrador(); fondo.classList.remove('ver'); }

/* ===========================================================================
   CARRERAS
   ===========================================================================
   Una sesión son varias carreras. Se elige cuántas y en cada una se van
   tocando las caras en el orden en que llegaron: primera que toques, primer
   lugar. Volver a tocarla la saca.

   Cada carrera se guarda como su propia partida, así que los marcadores
   cuentan bien: cuatro carreras son cuatro ganadas o perdidas, no una.
   =========================================================================== */
var nRondas = 1;
var ordenes = [];   // ordenes[i] = [idJugador, ...] en orden de llegada

/** Cómo se llama una ronda según el juego: carreras, rondas o peleas. */
function palabraRonda(plural) {
  var n = _sinAcentos(document.getElementById('m-juego').value || '').toLowerCase();
  if (/kart|carrera|race|racing|auto|rally/.test(n)) return plural ? 'carreras' : 'Carrera';
  if (/smash|pelea|lucha|fight|box|combate/.test(n)) return plural ? 'peleas' : 'Pelea';
  return plural ? 'rondas' : 'Ronda';
}

function pintarPodio() {
  var campoR = document.getElementById('m-rondas-campo');
  var campo  = document.getElementById('m-podio-campo');
  var podio  = document.getElementById('m-podio');

  campoR.hidden = campo.hidden = (seleccion.length === 0);
  if (!seleccion.length) return;

  // Cuántas
  document.getElementById('m-rondas-label').textContent = '¿Cuántas ' + palabraRonda(true) + '?';
  var cr = document.getElementById('m-rondas');
  cr.innerHTML = '';
  [1,2,3,4,5,6,8,12].forEach(function (n) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'filtro' + (nRondas === n ? ' on' : '');
    b.textContent = n;
    b.onclick = function () {
      nRondas = n;
      ordenes = ordenes.slice(0, n);
      pintarPodio();
      guardarBorrador();
    };
    cr.appendChild(b);
  });

  // El resultado de cada una
  document.getElementById('m-podio-label').textContent =
    'Resultado de cada ' + palabraRonda(false).toLowerCase();
  podio.innerHTML = '';

  for (var i = 0; i < nRondas; i++) {
    if (!ordenes[i]) ordenes[i] = [];
    podio.appendChild(bloqueRonda(i));
  }
}

function bloqueRonda(i) {
  var orden = ordenes[i];
  var d = document.createElement('div');
  d.className = 'ronda';

  var cab = document.createElement('div');
  cab.className = 'cab-r';
  cab.innerHTML = '<b>' + palabraRonda(false) + ' ' + (i + 1) + '</b>' +
    '<span class="pista">' +
      (orden.length === seleccion.length ? '✓ completa'
        : 'toca en el orden en que llegaron') + '</span>';
  if (orden.length) {
    var limpiar = document.createElement('button');
    limpiar.type = 'button';
    limpiar.textContent = 'limpiar';
    limpiar.onclick = function () { ordenes[i] = []; pintarPodio(); guardarBorrador(); };
    cab.appendChild(limpiar);
  }
  d.appendChild(cab);

  var pista = document.createElement('div');
  pista.className = 'pista-caras';

  seleccion.forEach(function (id) {
    var j = JUGADORES.filter(function (x) { return x.id === id; })[0] || { nombre: id, area: '' };
    var lugar = orden.indexOf(id) + 1;   // 0 si no está

    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'corredor' + (lugar ? ' puesto p' + lugar : '');
    b.innerHTML =
      (lugar ? '<span class="lug">' + lugar + '°</span>' : '') +
      '<span class="c"><img alt="" src="' +
        avatarUrl(j.nombre, j.area, AVATARES[j.nombre]) +
        '" onerror=\"if(this.parentNode)this.parentNode.textContent=\'' + avIniciales(j.nombre) + '\'"></span>' +
      '<span class="n">' + cortito(j.nombre) + '</span>';
    b.onclick = function () {
      var k = orden.indexOf(id);
      if (k === -1) orden.push(id); else orden.splice(k, 1);
      pintarPodio();
      guardarBorrador();
    };
    pista.appendChild(b);
  });

  d.appendChild(pista);
  return d;
}


document.getElementById('m-guardar').onclick = function () {
  if (seleccion.length < 2) { aviso('Elige al menos dos jugadores.', 'err'); return; }

  // Cada carrera tiene que estar completa: si falta alguien no se sabe en
  // qué lugar quedó, y el marcador saldría mal.
  var incompletas = [];
  for (var i = 0; i < nRondas; i++) {
    if (!ordenes[i] || ordenes[i].length !== seleccion.length) incompletas.push(i + 1);
  }
  if (incompletas.length) {
    aviso('Falta el resultado de ' + palabraRonda(incompletas.length > 1) + ' ' +
          incompletas.join(', ') + '.', 'err');
    return;
  }

  var btn = this;
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  var juego = document.getElementById('m-juego').value;
  var fecha = document.getElementById('m-fecha').value;
  var nota  = document.getElementById('m-nota').value;
  var una   = palabraRonda(false);

  var sesion = [];
  for (var r = 0; r < nRondas; r++) {
    sesion.push({
      juego: juego,
      fecha: fecha,
      nota: (nRondas > 1 ? una + ' ' + (r + 1) + ' de ' + nRondas : '') +
            (nota ? (nRondas > 1 ? ' · ' : '') + nota : ''),
      jugadores: ordenes[r].map(function (id, k) {
        var j = JUGADORES.filter(function (x) { return x.id === id; })[0] || { nombre: id };
        return { id: id, nombre: j.nombre, posicion: k + 1, puntos: '' };
      })
    });
  }

  // Se mandan una por una, en orden, para que las horas salgan en secuencia.
  var guardadas = 0;
  sesion.reduce(function (cadena, partida) {
    return cadena.then(function () {
      return gas('registrarPartida', [partida]).then(function (r) {
        if (!r || !r.ok) throw new Error((r && r.message) || 'el servidor la rechazó');
        guardadas++;
      });
    });
  }, Promise.resolve())
  .then(function () {
    tirarBorrador();
    fondo.classList.remove('ver');
    aviso('✓ ' + guardadas + ' ' + (guardadas === 1 ? una.toLowerCase() : palabraRonda(true)) +
          ' de ' + juego + ' guardada' + (guardadas === 1 ? '' : 's') + '.', 'ok');
    quitarAviso(6000);
    juegoSel = juego;
    cargar();
  })
  .catch(function (e) {
    aviso(guardadas ? 'Se guardaron ' + guardadas + ', pero falló el resto: ' + e.message
                    : 'No se guardó: ' + e.message, 'err');
    if (guardadas) cargar();
  })
  .then(function () { btn.disabled = false; btn.textContent = 'Guardar partida'; });
};

/* ===========================================================================
   CARGA
   =========================================================================== */
function cargar() {
  aviso('Cargando el tablero...');
  gas('getJuegosTablero', [])
    .then(function (r) {
      if (!r || r.error || !r.ok) throw new Error((r && r.message) || 'sin respuesta');
      JUEGOS = r.juegos || [];
      JUGADORES = r.jugadores || [];
      ponerLigaSite(r.hayIntranet);
      if (r.avatares) {
        AVATARES = r.avatares;
        try { localStorage.setItem('em_checar_avatares', JSON.stringify(AVATARES)); } catch (e) {}
      }
      PARTIDAS = r.partidas || [];
      tableroDesde = r.tableroDesde || '';
      document.getElementById('filtro-jugador').innerHTML = '';
      pintarTodo();
      quitarAviso(600);
    })
    .catch(function (e) {
      var msg = e.message || '';
      if (msg.indexOf('No permitida') !== -1) {
        aviso('Falta subir el backend de juegos: corre 5-SUBIR-TODO.bat y publica la versión nueva.', 'err');
      } else {
        aviso('No pude cargar el tablero: ' + msg, 'err');
      }
      JUEGOS = [{ juego: 'Mario Kart', icono: '🏁', modo: 'POSICION', activo: true },
                { juego: 'Smash Bros', icono: '🥊', modo: 'POSICION', activo: true }];
      pintarTodo();
    });
}

cargar();
