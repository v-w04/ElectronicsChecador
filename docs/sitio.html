<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Abriendo checador Electronics…</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 40%, #0e1d3a 0%, #050b18 100%);
    color: #E2E8F0; font-family: -apple-system, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { text-align: center; padding: 28px; }
  .spin {
    width: 46px; height: 46px; margin: 0 auto 18px;
    border: 3px solid rgba(127,223,255,0.2); border-top-color: #7fdfff;
    border-radius: 50%; animation: g 0.9s linear infinite;
  }
  @keyframes g { to { transform: rotate(360deg); } }
  h1 { font-size: 17px; font-weight: 800; margin: 0 0 6px; }
  p { font-size: 13px; color: #64748B; margin: 0 0 22px; }
  a {
    display: inline-block; padding: 14px 26px; border-radius: 12px;
    background: linear-gradient(135deg, #2456a8, #1e90ff); color: #fff;
    font-size: 15px; font-weight: 800; text-decoration: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="spin"></div>
  <h1>Abriendo checador Electronics…</h1>
  <p>Un momento — preparando la cámara del QR.</p>
  <a href="https://electronicsmexico.site/checador">📷 Abrir ahora</a>
</div>
<script>
  // ⭐ El sitio del QR solo se carga cuando esta pestaña YA está visible.
  // Si se carga en segundo plano, el navegador le niega la cámara y queda
  // en negro (por eso antes había que salir y regresar).
  var DESTINO = 'https://electronicsmexico.site/checador';
  function ir() { location.replace(DESTINO); }
  if (document.visibilityState === 'visible') {
    setTimeout(ir, 200);
  } else {
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') setTimeout(ir, 150);
    });
  }
</script>
</body>
</html>
