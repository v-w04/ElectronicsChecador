datosFecha.forEach(row => {

console.log('👥 ASISTENCIA HOY:', {

const pctFaltas = totalEmpleadosEsperados > 0 ? (faltas / totalEmpleadosEsperados) * 100 : 0;

      // Actualizar gauges con animación

      // ⭐ CALCULAR ASISTENCIA HOY (empleados que vinieron)

// ⭐ ACTUALIZAR GAUGE DE ASISTENCIA HOY
setTimeout(() => {

      // ⭐ Cargar alertas DE LA FECHA SELECCIONADA
      console.log('📋 Cargando alertas de', fechaFiltro, '...');

        .withSuccessHandler(result => {

              return fechaStr === fechaFiltro;

            console.log('🚨 Alertas para', fechaFiltro, ':', alertasCount);
                                  }

// ⭐ CARGAR INCIDENCIAS DEL DÍA (necesita totalEmpleadosEsperados de arriba)
console.log('📋 Cargando incidencias de', fechaFiltro, '...');

  })
  .getIncidenciasEmpleados(fechaFiltro);

  hideLoading();
      console.log('✅ updateKPIs completado para fecha:', fechaFiltro);
    }

    // Función para actualizar un gauge individual
    function updateGauge(id, percentage, value, total) {
      console.log(`🎯 updateGauge(${id}):`, { percentage, value, total });
      
      // Limitar porcentaje entre 0 y 100
      percentage = Math.max(0, Math.min(100, percentage));
      
      // Elementos del gauge
      const gaugePath = document.getElementById(`gauge-${id}`);
      const needle = document.getElementById(`needle-${id}`);
      const percentageEl = document.getElementById(`percentage-${id}`);
      const displayEl = document.getElementById(`${id === 'horas-extra' ? 'kpi-horas-extra-display' : `kpi-${id}-display`}`);
      
      console.log(`   Elementos encontrados:`, {
        gaugePath: !!gaugePath,
        needle: !!needle,
        percentageEl: !!percentageEl,
        displayEl: !!displayEl
      });
      
      if (!gaugePath || !needle || !percentageEl) {
        console.warn(`⚠️ Gauge ${id} no encontrado - elementos faltantes`);
        return;
      }
      
      // ⭐ Animar el arco del gauge con ease suave
const circumference = 251.2;
const offset = circumference - (circumference * percentage / 100);

// Agregar clase para animación suave
gaugePath.style.transition = 'stroke-dashoffset 2.5s cubic-bezier(0.4, 0, 0.2, 1)';
gaugePath.style.strokeDashoffset = offset;

// ⭐ Animar la aguja con ease elástico
const angle = -90 + (percentage * 1.8);
needle.style.transition = 'transform 2.5s cubic-bezier(0.34, 1.56, 0.64, 1)'; // Elastic ease
needle.style.transform = `rotate(${angle}deg)`;
      
      // Actualizar texto del porcentaje
      if (id === 'horas-extra') {
        percentageEl.textContent = value.toFixed(1) + 'h';
        if (displayEl) displayEl.textContent = value.toFixed(1) + 'h';
      } else {
        percentageEl.textContent = Math.round(percentage) + '%';
        
        if (displayEl) displayEl.textContent = value;
        
        if (total !== null && total !== undefined) {
          const totalEl = document.getElementById(`kpi-${id}-total`);
          if (totalEl) totalEl.textContent = total;
        }
      }
      
      // Animar el número con contador
      if (displayEl && id !== 'horas-extra') {
        animateCounter(displayEl, 0, value, 1500);
      }
      
      console.log(`✅ Gauge ${id} actualizado`);
    }

    // ⭐ MOVIMIENTO CONTINUO - Contador con ease out suave
function animateCounter(element, start, end, duration) {
  const range = end - start;
  const startTime = performance.now();
  
  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }
  
  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const easedProgress = easeOutCubic(progress);
    const current = start + (range * easedProgress);
    
    element.textContent = Math.round(current);
    
    if (progress < 1) {
      requestAnimationFrame(update);
    } else {
      element.textContent = end;
      // ⭐ Micro-pulso al finalizar
      element.style.transform = 'scale(1.1)';
      setTimeout(() => {
        element.style.transform = 'scale(1)';
      }, 200);
    }
  }
  
  element.style.transition = 'transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
  requestAnimationFrame(update);
}

// Función para inicializar los gauges en 0
    function initializeGauges() {
  const gauges = ['retardos', 'faltas', 'vacaciones', 'hoy', 'incidencias'];
      
      gauges.forEach(id => {
        const gaugePath = document.getElementById(`gauge-${id}`);
        const needle = document.getElementById(`needle-${id}`);
        const percentageEl = document.getElementById(`percentage-${id}`);
        
        if (gaugePath && needle && percentageEl) {
          // Inicializar en posición 0
          gaugePath.style.strokeDashoffset = '251.2';
          needle.style.transform = 'rotate(-90deg)';
          
          if (id === 'horas-extra') {
            percentageEl.textContent = '0h';
          } else {
            percentageEl.textContent = '0%';
          }
        }
      });
      
      console.log('✅ Gauges inicializados');
    }

    // Función para resetear todos los valores a 0
    function resetKPIValues() {
      // Resetear displays numéricos
      const displays = [
  'kpi-hoy-display',
  'kpi-retardos-display',
  'kpi-faltas-display',
  'kpi-vacaciones-display',
  'kpi-incidencias-display'
];
      
      displays.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          if (id.includes('horas-extra')) {
            el.textContent = '0h';
          } else {
            el.textContent = '0';
          }
        }
      });
      
      console.log('✅ Valores KPI reseteados');
    }
</script>
